<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แฟ้มสะสมงานของฉัน</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body { 
    font-family: sans-serif; 
    background-color: #f4f7f6; 
    text-align: center;
    padding-bottom: 50px;
  }

  /* --- แถบเมนูด้านบน (Navbar) --- */
  .navbar {
    background-color: #2c3e50;
    overflow: hidden;
    display: flex;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 1000;
  }

  .navbar a {
    color: white;
    text-align: center;
    padding: 16px 24px;
    text-decoration: none;
    font-size: 18px;
    transition: background-color 0.3s;
  }

  .navbar a:hover {
    background-color: #1abc9c;
  }

  .navbar a.active {
    background-color: #34495e;
    font-weight: bold;
  }
  /* ---------------------------- */

  .container { 
    max-width: 1000px; 
    margin: 40px auto 0 auto; 
    padding: 0 20px;
  }

  /* ปรับขนาดหัวข้อเรื่องให้ใหญ่ขึ้น */
  h1 {
    font-size: 2.8rem;
    margin-bottom: 20px;
  }

  /* ปรับขนาดรูปโปรไฟล์ */
  .profile-img {
    width: 320px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }

  /* ปรับขนาดตัวหนังสือคำอธิบาย */
  .intro-text {
    font-size: 1.4rem;
    margin-top: 25px;
    color: #333;
  }

  /* ปรับขนาดปุ่มกดให้ใหญ่ขึ้น */
  .btn { 
    display: inline-block; 
    background: #2c3e50; 
    color: white; 
    padding: 15px 35px; 
    font-size: 1.2rem;
    text-decoration: none; 
    border-radius: 8px; 
    margin-top: 35px; 
    transition: background-color 0.3s, transform 0.2s;
  }

  .btn:hover {
    background-color: #1abc9c;
    transform: scale(1.05);
  }
</style>
</head>
<body>

<!-- แถบเมนูด้านบน ( Navbar ) -->
<nav class="navbar">
  <a href="index.html">หน้าแรก</a>
  <a href="#about" class="active">เกี่ยวกับฉัน</a>
  <a href="#projects">ผลงาน</a>
  <a href="#contact">ติดต่อ</a>
</nav>

<div class="container" id="about">
  <h1>แฟ้มสะสมงาน (Portfolio) ปิยพัทธ์ โตมา</h1>
  <img src="img.jpg" alt="รูปโปรไฟล์ของฉัน" class="profile-img">
  <p class="intro-text">นี่คือพื้นที่รวบรวมผลงานและกิจกรรมที่ภูมิใจครับ</p>

  <!-- ปุ่มกดกลับหน้าแรก -->
  <a href="index.html" class="btn">กลับหน้าแรก</a>
</div>

</body>
</html>
